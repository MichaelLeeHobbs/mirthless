services:
  db:
    image: postgres:17-alpine
    container_name: galvaniflow-db-prod
    environment:
      # POSTGRES_DB / POSTGRES_USER default to galvaniflow. Postgres applies them only when
      # it first creates the data volume; an install created under the old name sets
      # POSTGRES_DB=mirthless and POSTGRES_USER=mirthless (see docs/ops/upgrade.md).
      POSTGRES_DB: ${POSTGRES_DB:-galvaniflow}
      POSTGRES_USER: ${POSTGRES_USER:-galvaniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - galvaniflow

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: galvaniflow-server
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-galvaniflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-galvaniflow}
    expose:
      - "3000"
    ports:
      # Inbound connector listener ports (TCP/MLLP for HL7, DICOM C-STORE, raw HTTP
      # source channels). The HTTP API + web UI are proxied through nginx on :80 and
      # do NOT need to be published here, but source connectors bind their own ports
      # inside the container and are otherwise unreachable from sending systems.
      #
      # Publish the range your channels listen on, whatever their protocol: a
      # listener (MLLP, HTTP, DICOM) on a port outside it starts without error
      # and is simply unreachable. The default 6661-6670 matches the example
      # channels; set LISTENER_PORT_RANGE in .env (MLLP_PORT_RANGE, the older
      # name, still works) or add lines here for ports outside one range.
      # See docs/ops/deployment.md for the listener-port strategy.
      - "${LISTENER_PORT_RANGE:-${MLLP_PORT_RANGE:-6661-6670}}:${LISTENER_PORT_RANGE:-${MLLP_PORT_RANGE:-6661-6670}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - galvaniflow

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: galvaniflow-web
    depends_on:
      - server
    ports:
      # The UI and API are plain HTTP on this port and carry logins and PHI.
      # By default it is reachable from this host only, for a TLS-terminating
      # proxy or load balancer on the same machine. Set WEB_BIND=0.0.0.0 only
      # when TLS is terminated in front of this host, or enable the TLS server
      # block in docker/nginx/default.conf. See docs/ops/tls-and-phi.md.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - galvaniflow

volumes:
  postgres_data:

networks:
  galvaniflow:
    driver: bridge
