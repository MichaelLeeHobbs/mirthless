# Access log without the query string or referer (#229). The image's default
# `main` format logs `$request`, the full request line, and message searches
# carry their terms (usually MRNs) in the query string. `$uri` is the path
# alone. This file is included inside nginx.conf's http block, where
# log_format is allowed.
log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log no_query;

    # Just above the largest body the server accepts: 50 MB of JSON for backup
    # restore, channel import and send-message (body-limit.middleware.ts). nginx
    # buffers the body before the server can refuse an anonymous caller, so a
    # larger cap only lets anyone make it hold more. Connector traffic (HL7,
    # DICOM, HTTP sources) goes to the connectors' own published ports, not here.
    client_max_body_size 51m;

    # ---------------------------------------------------------------------------
    # TLS termination (recommended for production)
    # ---------------------------------------------------------------------------
    # PHI must not traverse the network in plaintext. Terminate TLS here (or at an
    # upstream load balancer). To terminate at nginx, mount your certs and add a
    # second server block, then redirect port 80 -> 443:
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     # ... location blocks identical to below ...
    # }
    # And on this port-80 block: `return 301 https://$host$request_uri;`
    # ---------------------------------------------------------------------------

    # API proxy
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks
    location /health {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # Socket.IO WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus metrics — internal networks only (no auth on the endpoint).
    # Metrics can leak operational detail; do not expose them to the public
    # internet. Allow the Docker bridge networks + loopback; deny everything else.
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # SPA static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
