services:
  db:
    image: postgres:17-alpine
    container_name: galvanigraph-db
    environment:
      POSTGRES_DB: galvanigraph
      POSTGRES_USER: galvanigraph
      POSTGRES_PASSWORD: galvanigraph_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galvanigraph -d galvanigraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Integration-test services (only start with: docker compose --profile test up) ---
  # Back the connector integration lane (packages/connectors *.itest.ts).
  # Match the env the gates expect (packages/connectors/src/__tests__/e2e/integration/gates.ts).

  sftp-test:
    image: atmoz/sftp:alpine
    container_name: galvanigraph-sftp-test
    profiles: ["test"]
    # user:password:::dir  → creates /home/mirth/upload, writable, chrooted.
    command: mirth:mirthpw:::upload
    ports:
      - "2222:22"

  mail-test:
    # GreenMail: SMTP (3025) + IMAP (3143) in one container for mail connectors.
    image: greenmail/standalone:2.1.15
    container_name: galvanigraph-mail-test
    profiles: ["test"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=mirth:mirthpw@example.com
    ports:
      - "3025:3025"
      - "3143:3143"

  mysql-test:
    # A partner MySQL database, also for the migration scenario suite (e2e/scenarios).
    image: mysql:8.4
    container_name: galvanigraph-mysql-test
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: mirthpw
      MYSQL_DATABASE: partner
      MYSQL_USER: mirth
      MYSQL_PASSWORD: mirthpw
    ports:
      - "3307:3306"
    healthcheck:
      # Over TCP: the image's first-start server, which has no port, answers on the socket.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -umirth -pmirthpw -e 'SELECT 1' partner > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-test:
    # Single-node KRaft Kafka for the Kafka connectors. 19092 is plaintext,
    # 19093 is SASL/PLAIN (user mirth / mirthpw). Topics are not auto-created.
    image: apache/kafka:4.3.1
    container_name: galvanigraph-kafka-test
    profiles: ["test"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,PLAINTEXT://:9092,SASL_PLAINTEXT://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-test:29092,PLAINTEXT://localhost:19092,SASL_PLAINTEXT://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      # The image refuses to start a SASL listener without KAFKA_OPTS; the JAAS
      # config is the per-listener property below, so this only has to be set.
      KAFKA_OPTS: -Dgalvanigraph.test=true
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="mirth" password="mirthpw" user_mirth="mirthpw";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:9092"
      - "19093:9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 24

  rabbitmq-test:
    # RabbitMQ for the AMQP connectors; the management API (15673) lets the
    # suite drop client connections to test reconnects. 5674 is AMQPS with a
    # test certificate the entrypoint writes to docker/test-certs on first start.
    image: rabbitmq:4.4-management-alpine
    container_name: galvanigraph-rabbitmq-test
    profiles: ["test"]
    entrypoint: ["/bin/sh", "/opt/galvanigraph/entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: mirth
      RABBITMQ_DEFAULT_PASS: mirthpw
    volumes:
      - ./rabbitmq-test/entrypoint.sh:/opt/galvanigraph/entrypoint.sh:ro
      - ./rabbitmq-test/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ./test-certs:/certs
    ports:
      - "5673:5672"
      - "5674:5671"
      - "15673:15672"
    healthcheck:
      # As the rabbitmq user: run as root, the CLI writes the Erlang cookie
      # before the broker does, and the broker then cannot read it.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 24

volumes:
  postgres_data:
