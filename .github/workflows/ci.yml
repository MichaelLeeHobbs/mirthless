name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow other workflows (e.g. docker-build on a tag) to gate on CI passing.
  workflow_call:

# Which jobs run is decided by the `changes` job (scripts/ci/classify-changes.mjs,
# rules at the top of that file). It fails toward running: a path it has no rule
# for, a tag, or any error runs everything. `ci-ok` is the one check branch
# protection requires, since a skipped job never reports.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      gate: ${{ steps.classify.outputs.gate }}
      test_filter: ${{ steps.classify.outputs.test_filter }}
      pg_integration: ${{ steps.classify.outputs.pg_integration }}
      connector_integration: ${{ steps.classify.outputs.connector_integration }}
      e2e: ${{ steps.classify.outputs.e2e }}
      docs: ${{ steps.classify.outputs.docs }}
      doc_tests: ${{ steps.classify.outputs.doc_tests }}
    steps:
      # Full history: a push compares with the commit before it, which may be
      # several commits back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plain Node on the runner: the classifier has no dependencies.
      - name: Classify changed files
        id: classify
        run: node scripts/ci/classify-changes.mjs

  build-lint-test:
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      NODE_ENV: test
      LOG_LEVEL: error
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build, lint and unit tests with coverage minimums: the steps of
      # `pnpm gate`, with unit tests narrowed to the changed packages and their
      # dependents (TEST_FILTER is -r on a full run). Build and lint stay
      # whole-repo. classify-changes.test.mjs fails if `gate` gains a step.
      - name: Gate (build, lint, test with coverage)
        env:
          TEST_FILTER: ${{ needs.changes.outputs.test_filter }}
        run: |
          pnpm build
          pnpm lint
          pnpm $TEST_FILTER run test:coverage
          pnpm test:ci

      # Fail on high/critical vulns in production deps.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Apply real Drizzle migrations to the CI Postgres, then run the
      # integration lane that exercises real SQL (queue, partitions, pruner,
      # channel + message round trip). These catch schema/SQL drift that the
      # mock-DB unit tests cannot.
      - name: Run database migrations
        if: needs.changes.outputs.pg_integration == 'true'
        run: pnpm db:migrate

      # data-source.itest.ts stores encrypted credentials, so it needs a
      # content key. Test-only value (64 hex chars), scoped to this step.
      - name: Integration tests (real Postgres)
        if: needs.changes.outputs.pg_integration == 'true'
        run: pnpm test:integration
        env:
          CONTENT_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 14

  # Real-protocol connector suites (packages/connectors *.itest.ts) against the
  # docker-compose `test` profile brokers and servers, plus Postgres.
  # CONNECTOR_ITEST_REQUIRED makes a missing service fail the run instead of
  # skipping its suite (see src/__tests__/e2e/integration/gates.ts).
  connector-integration:
    needs: changes
    if: needs.changes.outputs.connector_integration == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CONNECTOR_ITEST_REQUIRED: '1'
      DATABASE_URL: postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test
      SFTP_TEST_HOST: localhost
      SMTP_TEST_HOST: localhost
      KAFKA_TEST_BROKERS: localhost:19092
      AMQP_TEST_HOST: localhost
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Kafka and RabbitMQ have healthchecks, so --wait holds until they serve.
      # rabbitmq-test writes its test TLS certificate to docker/test-certs.
      - name: Start connector test services
        run: docker compose -f docker/docker-compose.yml --profile test up -d --wait sftp-test mail-test kafka-test rabbitmq-test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build connectors and their dependencies
        run: pnpm --filter "@galvaniflow/connectors..." build

      # SFTP and GreenMail have no healthcheck; their ports open once they serve.
      - name: Wait for SFTP and mail
        run: |
          for port in 2222 3025 3143; do
            timeout 60 bash -c "until (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done"
          done

      - name: Connector integration tests (real services)
        run: pnpm --filter @galvaniflow/connectors test:integration

      - name: Test service logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile test logs --no-color sftp-test mail-test kafka-test rabbitmq-test

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      NODE_ENV: test
      LOG_LEVEL: error
      FRONTEND_URL: http://localhost:5173
      CI: 'true'
      # Data source specs store encrypted credentials. Test-only value.
      CONTENT_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Playwright's webServer starts dev:server + dev:web; the specs log in as
      # the seeded admin, so the DB must be migrated and seeded first.
      - name: Migrate and seed database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Unit tests that read a changed doc (or other non-package file) when the
  # gate does not already run their package, so a docs-only change that breaks
  # docs/user/connector-reference.md still fails CI.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The doc tests import workspace packages through their built output.
      - name: Build
        run: pnpm build

      # DOC_TESTS has one line per package: `<name> <file> <file>...`.
      - name: Tests that read the changed files
        env:
          DOC_TESTS: ${{ needs.changes.outputs.doc_tests }}
        run: |
          while read -r pkg files; do
            [ -n "$pkg" ] || continue
            pnpm --filter "$pkg" exec vitest run $files
          done <<< "$DOC_TESTS"

  # The one required check. Passes when every job passed or was skipped; fails
  # when any failed or was cancelled, including `changes` itself.
  ci-ok:
    if: always()
    needs: [changes, build-lint-test, connector-integration, e2e, docs]
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a CI job ended $result"; exit 1 ;;
            esac
          done
