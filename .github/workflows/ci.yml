name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow other workflows (e.g. docker-build on a tag) to gate on CI passing.
  workflow_call:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      NODE_ENV: test
      LOG_LEVEL: error
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build, lint and unit tests with coverage minimums: the same command
      # agents and developers run locally before calling a change done.
      - name: Gate (build, lint, test with coverage)
        run: pnpm gate

      # Fail on high/critical vulns in production deps.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Apply real Drizzle migrations to the CI Postgres, then run the
      # integration lane that exercises real SQL (queue, partitions, pruner,
      # channel + message round trip). These catch schema/SQL drift that the
      # mock-DB unit tests cannot.
      - name: Run database migrations
        run: pnpm db:migrate

      # data-source.itest.ts stores encrypted credentials, so it needs a
      # content key. Test-only value (64 hex chars), scoped to this step.
      - name: Integration tests (real Postgres)
        run: pnpm test:integration
        env:
          CONTENT_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      NODE_ENV: test
      LOG_LEVEL: error
      FRONTEND_URL: http://localhost:5173
      CI: 'true'
      # Data source specs store encrypted credentials. Test-only value.
      CONTENT_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Playwright's webServer starts dev:server + dev:web; the specs log in as
      # the seeded admin, so the DB must be migrated and seeded first.
      - name: Migrate and seed database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
