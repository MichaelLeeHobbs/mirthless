name: Docker Build

# On a version tag: run CI, prove the image boots, then publish.
# On a pull request that touches what the images are built from: build both
# images and prove the server boots, so a broken Dockerfile is found in review
# and not at release time. Nothing is published from a pull request.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      # Migrations, the runtime role step and the seed run in the image's entrypoint.
      - 'packages/server/src/db/**'
      - '.dockerignore'
      - 'package.json'
      - 'packages/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: michaelleehobbs/galvaniflow

jobs:
  # Gate the release on the full CI suite passing for the tagged commit.
  # (A pull request already runs CI through its own workflow.)
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # Build the server image and prove it boots end-to-end: the entrypoint runs
  # migrations + seed against a real Postgres, then we curl /health/live.
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t galvaniflow-server:smoke .

      # Migrates as the owner, then creates and grants the server's own role
      # and runs the seed and server as it (D-307).
      - name: Run server container (migrates + seeds on start)
        run: |
          docker run -d --name galvaniflow-smoke --network host \
            -e MIGRATION_DATABASE_URL=postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test \
            -e DATABASE_URL=postgresql://galvaniflow_app:smoke_app_password@localhost:5432/galvaniflow_test \
            -e JWT_SECRET=ci-smoke-secret-that-is-at-least-32-characters \
            -e NODE_ENV=production \
            galvaniflow-server:smoke

      # /health/ready queries the database, so it proves the server's role works.
      - name: Wait for /health/ready
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health/ready; then
              echo "server healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::server did not become healthy"
          docker logs galvaniflow-smoke
          exit 1

      # /health/ready answers before the startup steps (job queue, then the
      # pruner scheduler; channel auto-deploy alongside) finish. A failed step
      # logs "Startup step failed" naming it (D-308). Wait until the scheduler
      # has started or a step has failed, then fail on any failed step.
      - name: Check the startup steps
        run: |
          for i in $(seq 1 30); do
            if docker logs galvaniflow-smoke 2>&1 | grep -q -e 'Pruner scheduler' -e 'Startup step failed'; then
              break
            fi
            sleep 2
          done
          if docker logs galvaniflow-smoke 2>&1 | grep -q 'Startup step failed'; then
            echo "::error::a server startup step failed"
            exit 1
          fi
          if ! docker logs galvaniflow-smoke 2>&1 | grep -q 'Pruner scheduler'; then
            echo "::error::the pruner scheduler never started"
            exit 1
          fi

      - name: Dump server logs
        if: always()
        run: docker logs galvaniflow-smoke || true

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t galvaniflow-web:smoke .

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci, smoke]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:latest

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
