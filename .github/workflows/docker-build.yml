name: Docker Build

# On a version tag: run CI, prove the image boots, then publish.
# On a pull request that touches what the images are built from: build both
# images and prove the server boots, so a broken Dockerfile is found in review
# and not at release time. Nothing is published from a pull request.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'package.json'
      - 'packages/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: michaelleehobbs/galvaniflow

jobs:
  # Gate the release on the full CI suite passing for the tagged commit.
  # (A pull request already runs CI through its own workflow.)
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # Build the server image and prove it boots end-to-end: the entrypoint runs
  # migrations + seed against a real Postgres, then we curl /health/live.
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galvaniflow_test
          POSTGRES_USER: galvaniflow
          POSTGRES_PASSWORD: galvaniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galvaniflow -d galvaniflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t galvaniflow-server:smoke .

      - name: Run server container (migrates + seeds on start)
        run: |
          docker run -d --name galvaniflow-smoke --network host \
            -e DATABASE_URL=postgresql://galvaniflow:galvaniflow_test@localhost:5432/galvaniflow_test \
            -e JWT_SECRET=ci-smoke-secret-that-is-at-least-32-characters \
            -e NODE_ENV=production \
            galvaniflow-server:smoke

      - name: Wait for /health/live
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health/live; then
              echo "server healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::server did not become healthy"
          docker logs galvaniflow-smoke
          exit 1

      - name: Dump server logs
        if: always()
        run: docker logs galvaniflow-smoke || true

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t galvaniflow-web:smoke .

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci, smoke]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:latest

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
